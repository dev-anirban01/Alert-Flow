
<div class="timeline">
  @for (item of history(); track item.id ?? item.ts) {
    <div class="timeline-item">
      <div class="timeline-indicator">
        <span
          class="timeline-dot"
          [class.open-dot]="item.state === 'OPEN'"
          [class.escalated-dot]="item.state === 'ESCALATED'"
          [class.auto-closed-dot]="item.state === 'AUTO_CLOSED'"
          [class.resolved-dot]="item.state === 'RESOLVED'">
        </span>

        @if (!$last) {
          <span class="timeline-line"></span>
        }
      </div>

      <div class="timeline-content">
        <div class="timeline-top">
          <strong>{{ item.state }}</strong>

          <time>
            {{ item.ts | date:'dd MMM, hh:mm a' }}
          </time>
        </div>

        @if (item.note || item.description) {
          <p>{{ item.note || item.description }}</p>
        }

        @if (item.performedBy) {
          <small>By {{ item.performedBy }}</small>
        }
      </div>
    </div>
  }
</div>
