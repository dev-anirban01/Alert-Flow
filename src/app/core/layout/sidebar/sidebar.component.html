@if (isOpen()) {
  <button
    class="sidebar-backdrop"
    type="button"
    aria-label="Close navigation"
    (click)="closeSidebar.emit()"
  ></button>
}

<aside class="sidebar" [class.sidebar-open]="isOpen()" aria-label="Main navigation">
  <div class="sidebar-brand">
    <div class="brand-icon">
      <i class="fa-solid fa-bell"></i>
    </div>

    <div class="brand-info">
      <h2>AlertFlow</h2>
      <span>Operations Console</span>
    </div>

    <button
      class="collapse-button"
      type="button"
      (click)="onToggleCollapsed()"
      [attr.aria-label]="isCollapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
      [attr.title]="isCollapsed() ? 'Expand sidebar' : 'Collapse sidebar'"
    >
      <i
        class="fa-solid"
        [class.fa-angles-left]="!isCollapsed()"
        [class.fa-angles-right]="isCollapsed()"
      >
      </i>
    </button>

    <button
      class="mobile-close"
      type="button"
      aria-label="Close navigation"
      (click)="closeSidebar.emit()"
    >
      <i class="fa-solid fa-xmark"></i>
    </button>
  </div>

  <div class="brand-divider"></div>

  <nav class="sidebar-navigation">
    <div class="nav-section">
      <span class="nav-section-label">WORKSPACE</span>

      <a
        class="nav-item"
        routerLink="/dashboard"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="onNavigationClick()"
      >
        <span class="nav-icon">
          <i class="fa-solid fa-house"></i>
        </span>

        <span class="nav-label">Dashboard</span>
      </a>

      <a
        class="nav-item"
        routerLink="/alerts"
        routerLinkActive="active"
        (click)="onNavigationClick()"
      >
        <span class="nav-icon">
          <i class="fa-solid fa-bell"></i>
        </span>

        <span class="nav-label">Alert Console</span>

        <span class="nav-count">12</span>
      </a>
    </div>

    <div class="nav-divider"></div>

    <div class="nav-section">
      <span class="nav-section-label">PREFERENCES</span>

      <a
        class="nav-item"
        routerLink="/settings"
        routerLinkActive="active"
        (click)="onNavigationClick()"
      >
        <span class="nav-icon">
          <i class="fa-solid fa-gear"></i>
        </span>

        <span class="nav-label">Settings</span>
      </a>
    </div>
  </nav>

  <div class="sidebar-footer">
    <div class="profile-avatar">AR</div>

    <div class="profile-info">
      <span class="profile-name">Admin User</span>
      <span class="profile-role">Administrator</span>
    </div>

    <button class="profile-menu" type="button" aria-label="Profile options" title="Profile options">
      <i class="fa-solid fa-ellipsis"></i>
    </button>
  </div>
</aside>
